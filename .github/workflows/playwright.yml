name: Playwright Tests

on:
  pull_request:
    branches: [main, staging]

# to enforce on all pull requests:
# on:
#   pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github_actions_demo_1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: github_actions_demo_1/package-lock.json

      - name: Create a .env file
        run: echo "EXAMPLE_SECRET=${{ secrets.EXAMPLE_SECRET }}" >> .env
          echo "EXAMPLE_SECRET2=${{ secrets.EXAMPLE_SECRET2 }}" >> .env

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: github_actions_demo_1/playwright-report/
          retention-days: 7
